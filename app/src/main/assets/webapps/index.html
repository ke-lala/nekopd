<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>I2P WebApps</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { margin: 0; padding: 22px; background: #101a2b; color: #f5f7fb; }
    main { max-width: 720px; margin: 0 auto; }
    h1 { margin: 6px 0 8px; font-size: 1.65rem; }
    p { color: #c5d0df; line-height: 1.5; }
    .notice { padding: 12px 14px; border: 1px solid #586986; border-radius: 12px; background: #1c2a40; }
    .apps { display: grid; gap: 12px; margin-top: 18px; }
    a { display: block; padding: 16px; border-radius: 14px; color: #fff; background: #263d5c; text-decoration: none; }
    a:active { background: #36577f; }
    strong { display: block; font-size: 1.05rem; }
    small { display: block; color: #c5d0df; margin-top: 5px; word-break: break-all; }
  </style>
</head>
<body>
  <main>
    <h1>I2P WebApps</h1>
  <p>网页由本机 i2pd 提供；点选 I2P 服务后会在应用内浏览器中打开。</p>
  <p class="notice">请先启动 i2pd 路由器。内置浏览器仅允许访问 .i2p 地址，网页请求通过本机 HTTP 代理转发。</p>
    <section class="apps" aria-label="I2P applications">
      <a href="i2papp://browser?url=http%3A%2F%2Fmail.i2p%2F">
        <strong>I2P 邮件</strong>
        <small>mail.i2p</small>
      </a>
      <a href="i2papp://browser?url=http%3A%2F%2Fwebirc.coldhell.i2p%2F">
        <strong>网页 IRC</strong>
        <small>webirc.coldhell.i2p</small>
      </a>
      <a href="i2papp://addressbook">
        <strong>地址簿查询</strong>
        <small>搜索此设备已缓存的 .i2p 名称</small>
      </a>
    </section>
  </main>
</body>
</html>
